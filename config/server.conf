# ConsoleCalculatorServer configuration
# Lines use key=value format. Environment variables override selected values.

host=0.0.0.0
port=5555
worker_threads=4
max_message_size=65536
log_file=/var/log/console-calculator/server.log

# PostgreSQL/libpq settings.
# The final libpq connection string is built by the server from these fields.
# For local Docker/devcontainer runs, the password is read from Docker secret:
#   secrets/cc_db_password.txt -> /run/secrets/cc_db_password
#
# Environment overrides:
#   CC_DB_HOST
#   CC_DB_PORT
#   CC_DB_NAME
#   CC_DB_USER
#   CC_DB_PASSWORD
#   CC_DB_PASSWORD_FILE
#   CC_DB_CONNECTION_STRING  # full explicit override, highest priority

database_host=localhost
database_port=5432
database_name=console_calculator
database_user=admin
database_password_file=/run/secrets/cc_db_password